<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bin Day 🗑️ — 55A Rectory Road</title>
<meta name="description" content="This week's and next week's rubbish & recycling collections for 55A Rectory Road, CO5 7HX.">
<meta name="theme-color" content="#12a594">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bin Day">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312a594'/%3E%3Ctext x='90' y='128' font-size='104' text-anchor='middle'%3E%F0%9F%97%91%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%91%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --food:#16a34a; --food-ink:#052e12;
    --recycling:#0ea5e9; --recycling-ink:#062b3d;
    --glass:#f59e0b; --glass-ink:#3a2600;
    --garden:#65a30d; --garden-ink:#1a2a03;
    --rubbish:#a855f7; --rubbish-ink:#2a0b47;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#0d1b2a;
    min-height:100dvh;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1200px 600px at 12% -10%, #ffe08a 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #7ef0d8 0%, transparent 50%),
      radial-gradient(900px 900px at 50% 120%, #a5b4ff 0%, transparent 55%),
      linear-gradient(160deg,#12d0b3 0%,#12a594 45%,#2b7bd8 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:560px;margin:0 auto}
  header{color:#fff;text-align:center;margin:6px 0 20px}
  .kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;opacity:.9}
  h1{font-size:clamp(34px,10vw,52px);line-height:1;font-weight:900;margin:6px 0 8px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
  .addr{font-weight:700;font-size:15px;opacity:.95;background:rgba(255,255,255,.18);display:inline-block;padding:6px 14px;border-radius:999px;backdrop-filter:blur(4px)}

  .card{
    background:#fff;border-radius:28px;padding:22px 20px 24px;margin-bottom:18px;
    box-shadow:0 18px 40px -14px rgba(6,24,44,.45),0 4px 0 rgba(0,0,0,.03);
    position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px}
  .card.this::before{background:linear-gradient(90deg,#ff8a3d,#ffcf33)}
  .card.next::before{background:linear-gradient(90deg,#7c5cff,#12b3d9)}
  .card.next{opacity:.97}

  .tag{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;border-radius:999px;color:#fff}
  .card.this .tag{background:linear-gradient(90deg,#ff7a2f,#ff9d33)}
  .card.next .tag{background:linear-gradient(90deg,#6d5cff,#12a9d9)}

  .when{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .day{font-size:clamp(30px,9vw,44px);font-weight:900;line-height:1}
  .date{font-size:16px;font-weight:700;color:#5b6b7b}
  .count{margin-top:10px;display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:17px;
    background:#0d1b2a;color:#fff;padding:8px 15px;border-radius:999px}
  .count.soon{background:#e11d48}
  .count.today{background:#16a34a;animation:pop 1.4s ease-in-out infinite}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .est{display:inline-block;margin-top:10px;margin-left:8px;font-size:12px;font-weight:800;color:#8a6d00;background:#fff3c4;border:1px solid #ffe08a;padding:5px 10px;border-radius:999px}

  .bins{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .bin{flex:1 1 140px;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;
    color:#fff;font-weight:800;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
  .bin .emoji{font-size:26px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .bin small{display:block;font-weight:700;font-size:11.5px;opacity:.85;letter-spacing:.02em}
  .b-food{background:var(--food)} .b-recycling{background:var(--recycling)}
  .b-glass{background:var(--glass)} .b-garden{background:var(--garden)}
  .b-rubbish{background:var(--rubbish)}

  footer{text-align:center;color:#fff;margin-top:6px;font-size:13px;line-height:1.6}
  footer a{color:#fff;font-weight:800}
  .updated{opacity:.85;font-size:12px;margin-top:8px}
  .ended{background:#fff;border-radius:24px;padding:26px 20px;text-align:center;font-weight:700;color:#0d1b2a}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">🗑️ Bin Day</div>
      <h1>What's out?</h1>
      <div class="addr">55A Rectory Road, CO5&nbsp;7HX</div>
    </header>
    <main id="app"><!-- rendered by JS --></main>
    <footer>
      <div>Out on your boundary by <strong>7am</strong> on collection day.</div>
      <div class="updated" id="updated"></div>
      <div style="margin-top:8px"><a href="https://www.colchester.gov.uk/collection-changes" target="_blank" rel="noopener">Colchester collection info ↗</a></div>
    </footer>
  </div>

<script>
(function(){
  // ---- Collection model ---------------------------------------------------
  // Collections are every Friday. Food waste goes out EVERY week.
  // Weeks alternate between a "recycling" week (mixed recycling + glass + garden)
  // and a "rubbish" week (non-recyclable general waste).
  // Anchor: Friday 5 June 2026 was a RUBBISH week (Food + Non-recyclable),
  // confirmed against the official Colchester calendar (29 May – 20 Nov 2026).
  var ANCHOR = Date.UTC(2026, 5, 5);          // 5 Jun 2026 (Fri), rubbish week
  var OFFICIAL_END = Date.UTC(2026, 10, 20);  // 20 Nov 2026, last printed date
  var DAY = 86400000, WEEK = 7 * DAY;

  var BINS = {
    food:      {cls:'b-food',      emoji:'🍎', name:'Food waste',     sub:'Every week'},
    recycling: {cls:'b-recycling', emoji:'♻️', name:'Mixed recycling', sub:'Cans, paper, card, plastic'},
    glass:     {cls:'b-glass',     emoji:'🫙', name:'Glass',           sub:'Bottles & jars'},
    garden:    {cls:'b-garden',    emoji:'🌿', name:'Garden waste',    sub:'Grass & clippings'},
    rubbish:   {cls:'b-rubbish',   emoji:'🗑️', name:'Non-recyclable',  sub:'General rubbish'}
  };
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // UTC-midnight of "today" (avoids timezone drift when comparing dates).
  function todayUTC(){ var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }

  // Next collection (a Friday) on or after `from`.
  function nextFridayFrom(from){
    var d = new Date(from);
    var add = (5 - d.getUTCDay() + 7) % 7;    // 5 = Friday
    return from + add * DAY;
  }

  // Which bins go out on a given Friday.
  function binsFor(ts){
    var weekIdx = Math.round((ts - ANCHOR) / WEEK);
    var recyclingWeek = (weekIdx % 2 !== 0);  // anchor (idx 0) is a rubbish week
    var list = ['food'];
    if (recyclingWeek){ list.push('recycling','glass','garden'); }
    else { list.push('rubbish'); }
    return list;
  }

  function fmtDate(ts){ var d = new Date(ts); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function dayName(ts){ return DAYS[new Date(ts).getUTCDay()]; }

  function countdown(ts, today){
    var days = Math.round((ts - today) / DAY);
    if (days <= 0) return {txt:'Today! 🎉', cls:'today'};
    if (days === 1) return {txt:'Tomorrow', cls:'soon'};
    if (days <= 3) return {txt:'In ' + days + ' days', cls:'soon'};
    return {txt:'In ' + days + ' days', cls:''};
  }

  function binChips(list){
    return list.map(function(k){
      var b = BINS[k];
      return '<div class="bin ' + b.cls + '"><span class="emoji">' + b.emoji + '</span>' +
             '<span>' + b.name + '<small>' + b.sub + '</small></span></div>';
    }).join('');
  }

  function collectionCard(ts, kind, today){
    var isNext = kind === 'next';
    var c = countdown(ts, today);
    var estimated = ts > OFFICIAL_END;
    return '<section class="card ' + kind + '">' +
      '<span class="tag">' + (isNext ? '📆 Next week' : '⭐ This week') + '</span>' +
      '<div class="when"><span class="day">' + dayName(ts) + '</span>' +
        '<span class="date">' + fmtDate(ts) + '</span></div>' +
      '<div><span class="count ' + c.cls + '">' + c.txt + '</span>' +
        (estimated ? '<span class="est">estimated ✏️</span>' : '') + '</div>' +
      '<div class="bins">' + binChips(binsFor(ts)) + '</div>' +
      '</section>';
  }

  // ---- Render -------------------------------------------------------------
  var today = todayUTC();
  var thisWeek = nextFridayFrom(today);
  var nextWeek = thisWeek + WEEK;

  document.getElementById('app').innerHTML =
    collectionCard(thisWeek, 'this', today) +
    collectionCard(nextWeek, 'next', today);

  var now = new Date();
  document.getElementById('updated').textContent =
    'Showing collections as of ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear() + '.';
})();
</script>
</body>
</html>
